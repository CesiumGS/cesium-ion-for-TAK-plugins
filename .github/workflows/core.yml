name: core

on:
  push:
    paths:
      - "core/**"
      - "spec/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "spec/**"
      - ".github/workflows/core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17: minimum for Gradle 9. 25: what current Android Studio bundles.
        java: ["17", "25"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared ion core against spec/ion-contract
        run: ./gradlew test :ion-probe:installDist
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports-jdk${{ matrix.java }}
          path: core/ion-client-java/build/reports/tests/
