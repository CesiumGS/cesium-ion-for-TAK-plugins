# Copy to local.properties (never commit it).
sdk.dir=/Users/your-user/Library/Android/sdk
atakVersion=5.7.0

# Optional. Without it, the build searches this checkout's parent folders and
# ~/Documents, ~/Downloads, ~/Desktop, and ~ for the ATAK SDK (a folder holding
# atak-gradle-takdev.jar, main.jar, and android_keystore) and prints what it
# found. Set it to pin a specific SDK; the jar or the SDK folder both work.
#takdev.plugin=/Users/your-user/Documents/ATAK-CIV-5.7.0-SDK/atak-gradle-takdev.jar
